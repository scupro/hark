# XcodeGen spec for users with Xcode: `brew install xcodegen && xcodegen && open Hark.xcodeproj`.
# The generated Hark.xcodeproj is gitignored. Set DEVELOPMENT_TEAM (or pick your team in Xcode → Signing).
name: Hark

options:
  bundleIdPrefix: app.hark
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: ""            # ← your team ID (a free personal team works; apps then expire after 7 days)
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO

packages:
  HarkKit:
    path: .                         # the local Swift package (Package.swift in this directory)

targets:
  Hark-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iOS
      - path: Resources/Fonts
        type: folder
    dependencies:
      - package: HarkKit
        product: HarkKit
    settings:
      base:
        PRODUCT_NAME: Hark
        PRODUCT_BUNDLE_IDENTIFIER: app.hark.ios
        INFOPLIST_FILE: Resources/HarkiOS-Info.plist   # URL scheme `hark`, BGTaskSchedulerPermittedIdentifiers, UIBackgroundModes=fetch, ATS localhost
        TARGETED_DEVICE_FAMILY: "1,2"
        # HarkKit itself is Swift 6 (strict concurrency). The iOS app target can't be compiled without the iOS SDK
        # here, so it uses Swift 5 mode to keep any SDK-specific concurrency diagnostics as warnings.
        SWIFT_VERSION: "5.0"
    scheme: {}

  Hark-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/HarkMac
      - path: Resources/Fonts
        type: folder
    dependencies:
      - package: HarkKit
        product: HarkKit
    settings:
      base:
        PRODUCT_NAME: Hark
        PRODUCT_BUNDLE_IDENTIFIER: app.hark.mac
        INFOPLIST_FILE: Resources/HarkMac-Info.plist   # LSUIElement, URL scheme `hark`, ATS localhost
        SWIFT_VERSION: "6.0"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
    scheme: {}
